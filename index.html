<!doctype html>
<html lang="en" data-theme="light" data-text="medium">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA Driver Test Practice</title>
<meta name="description" content="Offline practice for the California Class C driver's license knowledge test.">
<meta name="theme-color" content="#1f5fbf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DMV Practice">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
</head>
<body>
<a class="skip" href="#main" data-i18n="Skip to main content">Skip to main content</a>
<header class="topbar">
  <button type="button" class="brand" data-nav="home" aria-label="CA Driver Test Practice, go to Home" data-i18n-aria="CA Driver Test Practice, go to Home"><img src="img/logo.svg" alt="" width="40" height="40"><span>CA Driver Test Practice</span></button>
  <nav aria-label="Main" class="tabbar" data-i18n-aria="Main">
    <button type="button" data-nav="home"><span class="ico" aria-hidden="true">🏠</span><span class="lbl" data-i18n="Home">Home</span></button>
    <button type="button" data-nav="handbook"><span class="ico" aria-hidden="true">📖</span><span class="lbl" data-i18n="Handbook">Handbook</span></button>
    <button type="button" data-nav="progress"><span class="ico" aria-hidden="true">📊</span><span class="lbl" data-i18n="Progress">Progress</span></button>
    <button type="button" data-nav="settings"><span class="ico" aria-hidden="true">⚙️</span><span class="lbl" data-i18n="Settings">Settings</span></button>
    <button type="button" data-nav="sources"><span class="ico" aria-hidden="true">🔗</span><span class="lbl" data-i18n="Sources">Sources</span></button>
    <button type="button" data-nav="help"><span class="ico" aria-hidden="true">❓</span><span class="lbl" data-i18n="Help">Help</span></button>
  </nav>
</header>
<div id="banner" class="banner" role="alert" hidden></div>
<main id="main" tabindex="-1"></main>
<footer class="footer">
  <p id="notice"></p>
</footer>

<dialog id="zoom" aria-labelledby="zoomTitle">
  <div class="dlg-head"><h2 id="zoomTitle" data-i18n="Enlarged picture">Enlarged picture</h2><button type="button" class="btn" data-close data-i18n="Close">Close</button></div>
  <img id="zoomImg" alt="">
  <p id="zoomAlt" class="muted"></p>
</dialog>
<dialog id="confirm" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle"></h2>
  <p id="confirmText"></p>
  <div class="row end"><button type="button" class="btn" id="confirmNo">Cancel</button><button type="button" class="btn primary" id="confirmYes">OK</button></div>
</dialog>

<dialog id="noteDlg" aria-labelledby="noteTitle">
  <h2 id="noteTitle" data-i18n="Note">Note</h2>
  <label for="noteText" class="sr" data-i18n="Note text">Note text</label>
  <textarea id="noteText" rows="5" style="width:min(80vw,520px);font:inherit;border-radius:10px;border:2px solid var(--border);background:var(--surface);color:var(--text);padding:.5rem"></textarea>
  <div class="row end" style="margin-top:.6rem"><button type="button" class="btn danger" id="noteDelete" data-i18n="Delete note">Delete note</button><button type="button" class="btn" id="noteCancel" data-i18n="Cancel">Cancel</button><button type="button" class="btn primary" id="noteSave" data-i18n="Save note">Save note</button></div>
</dialog>

<noscript><p class="banner">This app needs JavaScript turned on in your browser.</p></noscript>
<script src="data/sources.js"></script>
<script src="data/q-signs.js"></script>
<script src="data/q-signals-markings.js"></script>
<script src="data/q-roads.js"></script>
<script src="data/q-speed-parking.js"></script>
<script src="data/q-sharing.js"></script>
<script src="data/q-safety-laws.js"></script>
<script src="data/handbook-index.js"></script>
<script src="data/handbook-pages.js"></script>
<script src="js/i18n.js"></script>
<script src="data/tr-es.js"></script>
<script src="data/tr-pt.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
